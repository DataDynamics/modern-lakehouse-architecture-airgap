<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="960" viewBox="0 0 2180 960" role="img" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<title>한눈에 보는 Lakehouse — 데이터가 흘러가는 길</title>
<desc>Beginner-friendly concept view of the air-gapped lakehouse: six plain-language steps from where data is born to where people and AI use it, and four steps showing how the AI assistant prepares references, gathers evidence, writes an answer with an in-house model, and records the whole process.</desc>
<rect x="0" y="0" width="2180" height="960" fill="#FFFFFF"/>
<text x="40" y="52" font-size="26" font-weight="600" fill="#2C2C2A">한눈에 보는 Lakehouse — 데이터가 흘러가는 길</text>
<text x="40" y="80" font-size="13" fill="#5F5E5A">금융권 폐쇄망 데이터 플랫폼 개념도 (초보자용)  ·  괄호 안 영문은 실제 제품명  ·  기술 상세는 lakehouse-architecture-lr.svg</text>
