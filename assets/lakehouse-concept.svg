<text x="40" y="938" font-size="12" fill="#888780">위 줄의 ③ 창고에 보관한 문서와 ⑤ 창구의 데이터를 아래 줄의 AI 비서가 함께 사용합니다.   ·   화살표 = 데이터·정보가 넘어가는 방향</text>
