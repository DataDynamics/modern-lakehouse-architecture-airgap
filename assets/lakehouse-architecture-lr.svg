<svg xmlns="http://www.w3.org/2000/svg" width="2180" height="1150" viewBox="0 0 2180 1150" role="img" font-family="'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif">
<title>Lakehouse Reference Architecture</title>
<desc>Air-gapped modern lakehouse reference architecture, left to right: financial data sources, Cloudera CFM ingestion, Cloudera CDP streaming bus, MinIO storage with Iceberg, Cloudera CDE processing, Starburst Trino federation with an on-premises model provider, consumption, a customer AI agent calling Starburst over MCP, and internally served customer models.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="2180" height="1150" fill="#FFFFFF"/>
<text x="40" y="48" font-size="22" font-weight="500" fill="#2C2C2A">Lakehouse Reference Architecture</text>
<text x="40" y="72" font-size="13" fill="#5F5E5A">Cloudera CFM · CDP · CDE  |  Starburst Trino  |  MinIO  |  Spotfire · Cloudera AI  |  고객 AI Agent</text>
