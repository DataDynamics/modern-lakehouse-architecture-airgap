<text x="40" y="1095" font-size="11" fill="#888780">배치 경로 : Source → CFM → MinIO   |   실시간 경로 : Source / CFM → Kafka(CDP) → CDE Spark Streaming → MinIO   |   조회 경로 : Starburst Trino → Spotfire · Cloudera AI   |   Agent 경로 : AI Agent → MCP → Starburst → 사내 모델</text>
<text x="40" y="1113" font-size="11" fill="#888780">실선 = 상시 데이터 흐름   ·   주황 점선 = 스트리밍 경로   ·   파랑 실선 = S3 직접 접근   ·   보라 일점쇄선 = 원천 직접 페더레이션   ·   청록 실선 = 모델 호출   ·   자주 실선 = Agent 도구 호출</text>
</svg>
